<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ベンチプレス予約表 A4・縦・印刷用</title>
  <style>
    @page {
      size: 210mm 297mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    :root {
      --fw-red: #e00018;
      --fw-black: #141414;
      --fw-yellow: #fff33b;
      --fw-line: #222;
      --fw-white: #fff;
      --fw-muted: #666;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #8a8a8a;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      color: var(--fw-black);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .pdf-toolbar {
      max-width: 210mm;
      margin: 8mm auto 4mm;
      padding: 0 10mm;
    }

    .pdf-btn {
      appearance: none;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--fw-white);
      background: var(--fw-black);
    }

    .pdf-btn:hover {
      filter: brightness(1.08);
    }

    .pdf-btn-row {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    .pdf-btn--png {
      background: #2a2a2a;
    }

    .pdf-hint {
      margin: 8px 0 0;
      font-size: 11px;
      line-height: 1.55;
      color: #444;
    }

    .pdf-hint--sub {
      margin: 6px 0 0;
      font-size: 10px;
      line-height: 1.45;
      color: #666;
    }

    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 0 auto 10mm;
      background: var(--fw-white);
      box-shadow: 0 4mm 16mm rgba(0, 0, 0, 0.14);
    }

    .inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 9mm 11mm 10mm;
    }

    .board {
      position: relative;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .title-bar {
      margin: 0;
      padding: 5mm 6mm;
      background: var(--fw-black);
      color: var(--fw-white);
      font-size: 26pt;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-align: center;
      line-height: 1.15;
      border: 0.4mm solid var(--fw-line);
      border-bottom: none;
    }

    /* ── 上：トップ画像（1920×1080・中央・横幅いっぱい） ── */
    .hero-photo {
      border: 0.4mm solid var(--fw-line);
      border-top: none;
      background: var(--fw-white);
      padding: 3mm 3mm 2.5mm;
      text-align: center;
      flex-shrink: 0;
    }

    .hero-photo-frame {
      width: 100%;
      margin: 0 auto;
      line-height: 0;
    }

    .hero-photo img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      object-position: center center;
      margin: 0 auto;
    }

    .hero-photo-fallback {
      margin: 0;
      padding: 28mm 6mm;
      font-size: 11pt;
      font-weight: 700;
      color: var(--fw-muted);
      line-height: 1.5;
    }

    /* ── 下：予約時間 ── */
    .time-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border: 0.4mm solid var(--fw-line);
      border-top: none;
    }

    .time-head {
      margin: 0;
      padding: 3.5mm 4mm;
      background: var(--fw-red);
      color: var(--fw-white);
      font-size: 17pt;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.1em;
      line-height: 1.2;
    }

    .time-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .time-table td {
      border-top: 0.35mm solid var(--fw-line);
      border-bottom: 0.35mm solid var(--fw-line);
      height: 28mm;
      padding: 0;
      vertical-align: middle;
      background: var(--fw-white);
    }

    .slot-inner {
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      height: 100%;
      padding: 0 5mm;
    }

    .slot-time {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4mm;
      flex: 1;
      max-width: 72mm;
      font-weight: 700;
      line-height: 1;
      color: var(--fw-black);
    }

    .slot-part {
      flex: 1;
      min-width: 20mm;
      max-width: 26mm;
      height: 1em;
    }

    .slot-colon {
      flex-shrink: 0;
      font-size: 30pt;
      font-weight: 800;
      line-height: 1;
      padding: 0 0.5mm;
    }

    .slot-tilde {
      flex-shrink: 0;
      font-size: 22pt;
      font-weight: 700;
      line-height: 1;
      color: var(--fw-black);
      padding: 0 3mm;
    }

    /* ── 下段：注意事項（左）＋タイマー置き（右） ── */
    .sheet-foot {
      display: flex;
      align-items: stretch;
      gap: 4.5mm;
      margin-top: 5mm;
      flex-shrink: 0;
    }

    .rules-block {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .rules {
      margin: 0;
      padding: 5.5mm 6mm 5.5mm 5mm;
      list-style: none;
      width: 100%;
      background: #fafafa;
      border: 0.35mm solid #ddd;
      border-left: 1.4mm solid var(--fw-red);
      min-height: 38mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .rules li {
      position: relative;
      margin: 0 0 3.5mm;
      padding-left: 1.15em;
      font-size: 14pt;
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: 0.03em;
      text-align: left;
    }

    .rules li::before {
      content: "●";
      position: absolute;
      left: 0;
      font-size: 0.85em;
    }

    .rules li:last-child {
      margin-bottom: 0;
    }

    .timer-zone {
      width: 48mm;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border: 0.4mm solid var(--fw-line);
      background: var(--fw-white);
      overflow: hidden;
      min-height: 38mm;
    }

    .timer-head {
      margin: 0;
      padding: 2.8mm 3mm;
      background: var(--fw-black);
      color: var(--fw-white);
      font-size: 10pt;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.22em;
      line-height: 1;
    }

    .timer-dock {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3mm;
      background:
        linear-gradient(180deg, #ececec 0%, #f7f7f7 18%, #fff 55%);
      box-shadow: inset 0 1.2mm 2.8mm rgba(0, 0, 0, 0.09);
    }

    .timer-dock svg {
      width: 16mm;
      height: 16mm;
      opacity: 0.22;
    }

    .hl-yellow {
      background: var(--fw-yellow);
      padding: 0.5mm 1mm;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    @media print {
      html, body {
        width: 210mm;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
      }

      .title-bar,
      .time-head,
      .timer-head,
      .hl-yellow,
      .rules {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .timer-dock {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        background: #ececec !important;
      }

      .pdf-toolbar {
        display: none !important;
      }

      .sheet {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        box-shadow: none !important;
      }

      .inner {
        padding: 8mm 10mm 9mm;
      }

      .title-bar {
        font-size: 24pt;
        padding: 4.5mm 5mm;
      }

      .hero-photo {
        padding: 2.5mm 2.5mm 2mm;
      }

      .time-head {
        font-size: 16pt;
        padding: 3.5mm 3mm;
      }

      .time-table td {
        height: 26mm;
      }

      .slot-colon {
        font-size: 28pt;
      }

      .slot-tilde {
        font-size: 20pt;
        padding: 0 2.5mm;
      }

      .slot-time {
        gap: 3.5mm;
        max-width: 68mm;
      }

      .slot-part {
        min-width: 18mm;
        max-width: 24mm;
      }

      .rules li {
        font-size: 13pt;
      }

      .rules {
        min-height: 36mm;
        padding: 5mm 5.5mm;
      }

      .timer-zone {
        width: 46mm;
        min-height: 36mm;
      }
    }
  </style>

  <script>
    (function () {
      var PDF_ID = "btn-save-pdf";
      var PNG_ID = "btn-save-png";

      function bindPdf() {
        var btn = document.getElementById(PDF_ID);
        if (btn) btn.addEventListener("click", function () { window.print(); });
      }

      function pngFailMessage() {
        return "PNGの保存に失敗しました。ページを更新（F5）して、もう一度お試しください。";
      }

      function loadToPng() {
        var libEl = document.getElementById("html-to-image-lib");
        if (!libEl) return Promise.reject(new Error("lib missing"));
        var blob = new Blob([libEl.textContent], { type: "text/javascript" });
        var url = URL.createObjectURL(blob);
        return import(url).then(function (mod) {
          URL.revokeObjectURL(url);
          return mod.toPng;
        });
      }

      function bindPng() {
        var btn = document.getElementById(PNG_ID);
        if (!btn) return;
        btn.addEventListener("click", function () {
          var sheet = document.querySelector(".sheet");
          if (!sheet) return;
          var labels = ["高画質PNG保存（おすすめ）", "PNG作成中…"];
          btn.disabled = true;
          btn.textContent = labels[1];
          loadToPng()
            .then(function (toPng) {
              var baseOpts = {
                backgroundColor: "#ffffff",
                cacheBust: true,
                skipFonts: true,
                style: { margin: "0", boxShadow: "none" },
              };
              var ratios = [4, 2, 1];
              function toPngBest(el) {
                var ri = 0;
                function tryNext(err) {
                  if (ri >= ratios.length) return Promise.reject(err || new Error("PNG failed"));
                  var r = ratios[ri++];
                  return toPng(el, Object.assign({ pixelRatio: r }, baseOpts)).catch(function (e) {
                    return tryNext(e);
                  });
                }
                return tryNext(null);
              }
              return toPngBest(sheet);
            })
            .then(function (dataUrl) {
              var a = document.createElement("a");
              a.href = dataUrl;
              a.download = "fw-yoyaku-pop.png";
              document.body.appendChild(a);
              a.click();
              a.remove();
            })
            .catch(function (err) {
              console.error(err);
              alert(pngFailMessage());
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = labels[0];
            });
        });
      }

      bindPdf();
      bindPng();
    })();
  </script>
